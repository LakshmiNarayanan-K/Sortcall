<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1280px; height: 720px; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  .stage { width: 1280px; height: 720px; position: relative;
    background:
      radial-gradient(900px 600px at 88% -10%, rgba(52,211,153,0.25), transparent 60%),
      radial-gradient(700px 500px at -5% 110%, rgba(20,184,166,0.18), transparent 60%),
      linear-gradient(135deg, #071410, #0d211b);
  }
  .text { position: absolute; left: 56px; top: 110px; width: 620px; }
  .kicker { display: inline-block; background: rgba(52,211,153,0.15); border: 2px solid #34d399; color: #34d399;
    font-weight: 800; font-size: 26px; letter-spacing: 3px; padding: 8px 18px; border-radius: 999px; margin-bottom: 28px; }
  h1 { color: #ffffff; font-size: 92px; line-height: 1.02; font-weight: 900; letter-spacing: -2px; }
  h1 .green { color: #34d399; }
  h1 .red { color: #f87171; }
  .sub { margin-top: 26px; color: #8fb8a8; font-size: 34px; font-weight: 600; }
  .sub b { color: #e7f6ee; }
  .card { position: absolute; right: -40px; top: 60px; width: 620px; transform: rotate(3deg);
    border-radius: 24px; box-shadow: 0 40px 90px rgba(0,0,0,0.55), 0 0 0 2px rgba(52,211,153,0.4); overflow: hidden; }
  .card img { width: 100%; display: block; }
  .ai-chip { position: absolute; right: 560px; top: 42px; background: linear-gradient(135deg,#34d399,#14b8a6); color: #04120d;
    font-weight: 900; font-size: 30px; padding: 10px 22px; border-radius: 14px; transform: rotate(-4deg);
    box-shadow: 0 12px 30px rgba(0,0,0,0.45); }
  .footer { position: absolute; left: 56px; bottom: 40px; display: flex; align-items: center; gap: 16px; }
  .logo { width: 58px; height: 58px; border-radius: 16px; background: linear-gradient(135deg,#34d399,#14b8a6);
    color: #04120d; font-weight: 900; font-size: 24px; display: grid; place-items: center; }
  .brand { color: #e7f6ee; font-weight: 800; font-size: 34px; }
  .brand span { color: #34d399; }
</style>
</head>
<body>
<div class="stage">
  <div class="text">
    <div class="kicker">AI JUDGES YOUR TRASH</div>
    <h1><span class="green">RECYCLE</span><br>OR <span class="red">TRASH?</span></h1>
    <div class="sub">SortCall answers in <b>3 seconds</b> —<br>by <b>condition</b>, not category</div>
  </div>
  <div class="ai-chip">🤖 AI VERDICT</div>
  <div class="card"><img src="../screenshots/1-verdict-card.png"></div>
  <div class="footer">
    <div class="logo">SC</div>
    <div class="brand">Sort<span>Call</span> · NextStep Hacks 2026</div>
  </div>
</div>
</body>
</html>
